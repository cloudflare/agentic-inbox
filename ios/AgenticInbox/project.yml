name: AgenticInbox
options:
  bundleIdPrefix: com.cloudflare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  AgenticInbox:
    type: application
    platform: iOS
    sources:
      - path: AgenticInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudflare.AgenticInbox
        INFOPLIST_FILE: AgenticInbox/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgenticInbox/AgenticInbox.entitlements
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
schemes:
  AgenticInbox:
    build:
      targets:
        AgenticInbox: all
    run:
      config: Debug
