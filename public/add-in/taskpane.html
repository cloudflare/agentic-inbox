<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Inbox for Outlook</title>
  <link rel="stylesheet" href="/add-in/taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="/add-in/taskpane.js" defer></script>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">Outlook context</p>
    <h1>Agentic Inbox</h1>
    <p id="status">Loading Outlook context…</p>
    <dl><dt>Subject</dt><dd id="subject">Waiting for Outlook</dd><dt>Sender</dt><dd id="sender">Waiting for Outlook</dd></dl>
    <a id="open" href="/" target="_blank" rel="noreferrer noopener">Open Agentic Inbox</a>
  </main>
</body>
</html>
